name: Build & Release Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "JAVA_HOME: $JAVA_HOME"
          java -version
          JAVA_MAJOR=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | cut -d'.' -f1)
          echo "Detected Java major version: $JAVA_MAJOR"
          if [ -z "$JAVA_MAJOR" ]; then
            echo "::error::Unable to detect Java major version."
            exit 1
          fi
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "::error::Active Java major version must be 17 or newer. Detected version: $JAVA_MAJOR"
            exit 1
          fi
          echo "Java environment verified: Java $JAVA_MAJOR (>= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "Temporary debug keystore ./debug.keystore already exists."
          else
            echo "Creating temporary debug keystore ./debug.keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "::error::Failed to create ./debug.keystore"
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          APK_TARGET="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_TARGET" ]; then
            echo "::error::Expected debug APK not found at $APK_TARGET."
            echo "Searching only inside app/build/outputs/apk:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 3 -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          if [ ! -s "$APK_TARGET" ]; then
            echo "::error::APK file at $APK_TARGET is empty."
            exit 1
          fi
          if [[ "$APK_TARGET" != *.apk ]]; then
            echo "::error::Target does not have .apk extension: $APK_TARGET"
            exit 1
          fi
          if [ "$APK_TARGET" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "::error::APK path mismatch: $APK_TARGET"
            exit 1
          fi
          echo "Debug APK verified successfully: $APK_TARGET"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_DIR=$(mktemp -d "${RUNNER_TEMP:-/tmp}/apk-release-asset-XXXXXX")
          REPO_RAW="${{ github.repository }}"
          REPO_NAME=$(echo "$REPO_RAW" | awk -F'/' '{print $2}' | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9_-]/-/g')
          if [ -z "$REPO_NAME" ]; then
            REPO_NAME="android-app"
          fi
          ASSET_FILENAME="${REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          ASSET_FULLPATH="${TEMP_DIR}/${ASSET_FILENAME}"
          cp "app/build/outputs/apk/debug/app-debug.apk" "$ASSET_FULLPATH"
          if [ ! -f "$ASSET_FULLPATH" ] || [ ! -s "$ASSET_FULLPATH" ]; then
            echo "::error::Prepared release asset is invalid or empty: $ASSET_FULLPATH"
            exit 1
          fi
          echo "asset_path=${ASSET_FULLPATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${ASSET_FILENAME}" >> "$GITHUB_OUTPUT"
          echo "Prepared APK release asset at $ASSET_FULLPATH"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Release asset validation failed. Asset does not exist or is empty: $ASSET_PATH"
            exit 1
          fi
          if [[ "$ASSET_PATH" != *.apk ]]; then
            echo "::error::Release asset is not an APK: $ASSET_PATH"
            exit 1
          fi

          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          TARGET_COMMIT="${{ github.sha }}"

          RELEASE_NOTES=$(cat <<EOF
          ### Automated Debug APK Build

          - **Build System**: Built automatically by GitHub Actions
          - **Workflow Run Number**: #${{ github.run_number }}
          - **Workflow Run Attempt**: ${{ github.run_attempt }}
          - **Commit SHA**: \`${TARGET_COMMIT}\`
          - **Artifact Filename**: \`${ASSET_NAME}\`

          > **Note**: This is an automatically generated debug APK intended for testing purposes. It is signed with a temporary debug keystore and is not a Play Store production release.
          EOF
          )

          gh release create "$TAG_NAME" "$ASSET_PATH" \
            --target "$TARGET_COMMIT" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${TAG_NAME}"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "=== GitHub Release Published Successfully ==="
            gh release view "$TAG_NAME" || true
            echo "Release Tag: $TAG_NAME"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Name: $ASSET_NAME"

            echo "### 🚀 Debug APK Build & Release Summary" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Status**: ✅ GitHub Release published successfully" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Direct Release Page**: [View Release & Download APK]($RELEASE_URL)" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Asset Filename**: \`$ASSET_NAME\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **How to Download**: Scroll to the **Assets** section on the release page to download the \`.apk\` directly to your Android device." >> "$GITHUB_STEP_SUMMARY"
            echo "- **Backup**: The standard GitHub Actions artifact named \`app-debug-apk\` is also stored and available in this run's Artifacts section." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed or was skipped."
            echo "The debug APK was built successfully."
            echo "The Actions artifact 'app-debug-apk' remains fully available in this workflow run."

            echo "### ⚠️ Debug APK Build Summary" >> "$GITHUB_STEP_SUMMARY"
            echo "- **APK Build**: ✅ Succeeded (\`app/build/outputs/apk/debug/app-debug.apk\`)" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Artifact Upload**: ✅ Succeeded (\`app-debug-apk\`)" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Publishing**: ⚠️ Publishing encountered an error or lacked repository release permission." >> "$GITHUB_STEP_SUMMARY"
            echo "- **How to Download APK**: Download the \`app-debug-apk\` artifact directly from the **Artifacts** section at the bottom of this workflow run page." >> "$GITHUB_STEP_SUMMARY"
          fi
